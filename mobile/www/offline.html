<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#29101b">
  <title>Vaultlix — Offline</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#29101b;color:#fff}
    body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(28px + env(safe-area-inset-top)) 26px calc(28px + env(safe-area-inset-bottom));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(420px,100%);text-align:center}.mark{width:76px;height:76px;margin:0 auto 28px;border-radius:24px;display:grid;place-items:center;background:#6b1f3a;box-shadow:0 18px 48px rgba(0,0,0,.28);font-family:Georgia,serif;font-size:46px;font-weight:400}
    h1{margin:0;font-size:29px;line-height:1.18;letter-spacing:-.02em}p{margin:15px auto 0;max-width:330px;color:#d9cbd1;font-size:16px;line-height:1.55}
    button{width:100%;min-height:52px;margin-top:30px;border:0;border-radius:16px;background:#f8edf1;color:#6b1f3a;font:700 16px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    small{display:block;margin-top:17px;color:#a9959e;font-size:12px;line-height:1.45}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">V</div>
    <h1>Vaultlix is offline</h1>
    <p>Connect to the internet and try again. Your identity, keys and conversations remain safely on this phone.</p>
    <button type="button" onclick="location.href='https://vaultlix.com/'">Try again</button>
    <small>Vaultlix reconnects automatically when a connection becomes available.</small>
  </main>
  <script>window.addEventListener('online',()=>{location.href='https://vaultlix.com/'});</script>
</body>
</html>
