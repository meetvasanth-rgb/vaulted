<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Get Vaultlix for private chats and calls on iPhone or Android.">
  <title>Get Vaultlix</title>
  <link rel="icon" href="/icons/favicon-32.png">
  <style>
    body{margin:0;background:#faf6f7;color:#382c32;font-family:system-ui,sans-serif}main{max-width:580px;margin:8vh auto;padding:28px}.app-icon{width:72px;border-radius:18px}h1{font-size:42px;margin-bottom:12px}p{line-height:1.6;color:#6c5962}.card{padding:22px;background:white;border:1px solid #e5d8dd;border-radius:18px;margin:16px 0}h2{margin:0 0 14px;font-size:21px}.store-links{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.store-badge{display:inline-flex;align-items:center;justify-content:center;line-height:0;border-radius:8px}.store-badge:focus-visible{outline:3px solid #b9909f;outline-offset:4px}.store-badge img{display:block;width:auto}.store-badge.apple img{height:40px}.store-badge.google img{height:60px;margin:-10px 0}.button{display:inline-block;padding:14px 22px;margin:5px 5px 5px 0;background:#682c43;color:white;border-radius:12px;text-decoration:none}.button.secondary{background:white;color:#682c43;border:1px solid #d7c4cb}footer{margin-top:30px;font-size:14px}
  </style>
  <script>
    (function routeToPhoneStore(){
      var ua=navigator.userAgent||'';
      if(/iPhone|iPad|iPod/i.test(ua)) location.replace('https://apps.apple.com/in/app/vaultlix/id6798266989');
      else if(/Android/i.test(ua)) location.replace('https://play.google.com/store/apps/details?id=com.vaultlix.app');
    })();
  </script>
</head>
<body>
  <main>
    <img class="app-icon" src="/icons/icon-192.png" alt="Vaultlix">
    <h1>Private chats.<br>Closer connections.</h1>
    <p>Vaultlix normally opens the correct store automatically. You can also choose your device below.</p>
    <section class="card"><h2>Choose your phone</h2><div class="store-links"><a class="store-badge apple" href="https://apps.apple.com/in/app/vaultlix/id6798266989" aria-label="Download Vaultlix on the App Store"><img src="/media/download-on-the-app-store.svg" alt="Download on the App Store"></a><a class="store-badge google" href="https://play.google.com/store/apps/details?id=com.vaultlix.app" aria-label="Get Vaultlix on Google Play"><img src="/media/get-it-on-google-play.png" alt="Get it on Google Play"></a></div></section>
    <a class="button secondary" href="/">Open Vaultlix on the web</a>
    <footer>This link shares the app only. Ask your friend separately for their Vaultlix contact details.</footer>
  </main>
</body>
</html>
